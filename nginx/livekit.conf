# Nginx config para LiveKit API (WebSocket de sinalização)
# Salvar em: /etc/nginx/sites-available/livekit.seudominio.com.conf
# Substitua "seudominio.com" pelo seu domínio real

server {
    listen 80;
    listen [::]:80;
    server_name livekit.seudominio.com;

    # Redireciona HTTP para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name livekit.seudominio.com;

    ssl_certificate     /etc/letsencrypt/live/seudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seudominio.com/privkey.pem;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    ssl_session_cache   shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";

    access_log /var/log/nginx/livekit/access.log;
    error_log  /var/log/nginx/livekit/error.log;

    # Slash command /banda do Discord relay.
    location = /discord/interactions {
        proxy_pass              http://127.0.0.1:8080/discord/interactions;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass              http://127.0.0.1:7880;
        proxy_http_version      1.1;

        # WebSocket — obrigatório
        proxy_set_header        Upgrade $http_upgrade;
        proxy_set_header        Connection "Upgrade";

        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        proxy_buffering         off;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
    }
}
