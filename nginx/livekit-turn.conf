# Nginx config para LiveKit TURN server (melhora conexões com NAT restritivo)
# Salvar em: /etc/nginx/sites-available/livekit-turn.seudominio.com.conf
# Substitua "seudominio.com" pelo seu domínio real

server {
    listen 80;
    listen [::]:80;
    server_name livekit-turn.seudominio.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name livekit-turn.seudominio.com;

    ssl_certificate     /etc/letsencrypt/live/seudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seudominio.com/privkey.pem;

    ssl_session_cache   shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";

    access_log /var/log/nginx/livekit-turn/access.log;
    error_log  /var/log/nginx/livekit-turn/error.log;

    location / {
        proxy_pass              http://127.0.0.1:5349;
        proxy_http_version      1.1;

        proxy_set_header        Upgrade $http_upgrade;
        proxy_set_header        Connection "Upgrade";

        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        proxy_read_timeout      90;
    }
}
