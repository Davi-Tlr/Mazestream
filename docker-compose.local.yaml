# Exclusivo para localhost. Nao publicar estas portas ou chaves na internet.
services:
  livekit:
    image: livekit/livekit-server:v1.13.6
    command: ["--dev", "--config", "/etc/livekit.local.yaml", "--bind", "0.0.0.0"]
    ports:
      - "127.0.0.1:7880:7880/tcp"
      - "127.0.0.1:7881:7881/tcp"
      - "127.0.0.1:7882:7882/udp"
    volumes:
      - ./deploy/livekit.local.yaml:/etc/livekit.local.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
