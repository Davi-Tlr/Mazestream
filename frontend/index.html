<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f3f0" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>Mazestream</title>
  <script>
    // Resolve o tema ANTES do React montar, pra primeira pintura ja vir certa (sem flash).
    (function () {
      try {
        var pref = localStorage.getItem("tema") || "auto";
        var escuro = pref === "escuro" ||
          (pref === "auto" && window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var efetivo = escuro ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", efetivo);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", escuro ? "#0d0e11" : "#f4f3f0");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/app/main.jsx"></script>
</body>
</html>
