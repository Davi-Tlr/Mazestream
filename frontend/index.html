<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>LiveKit Screen Share</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<script src="/config.js"></script>
<style>
  :root {
    color-scheme: light;
    --preto: #090909;
    --cinza-900: #1d1d1f;
    --cinza-600: #6e6e73;
    --cinza-300: #d2d2d7;
    --cinza-100: #f5f5f7;
    --branco: #fff;
    --sucesso: #16803f;
    --sucesso-bg: #edf9f1;
    --aviso: #a65300;
    --aviso-bg: #fff7e8;
    --perigo: #d92d20;
    --perigo-bg: #fff0ee;
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; background: var(--branco); }
  body {
    min-height: 100dvh;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background: var(--cinza-100);
    color: var(--cinza-900);
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; }
  button { touch-action: manipulation; }
  #entrar {
    width: min(440px, calc(100% - 40px));
    margin: clamp(56px, 11vh, 120px) auto;
    padding: clamp(28px, 5vw, 46px);
    background: var(--branco);
    border: 1.5px solid var(--preto);
    border-radius: 2px;
    box-shadow: 8px 8px 0 var(--preto);
  }
  #entrar .marca {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 44px;
    font-size: 11px;
    font-weight: 750;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  #entrar .marca::before { content: ""; width: 9px; height: 9px; background: var(--preto); }
  #entrar h1 {
    max-width: 330px;
    margin: 0 0 14px;
    font-size: clamp(38px, 8vw, 54px);
    line-height: .96;
    letter-spacing: -.055em;
    font-weight: 720;
  }
  #entrar p.sub { margin: 0 0 32px; color: var(--cinza-600); font-size: 15px; line-height: 1.45; }
  label { display: block; font-size: 12px; color: var(--cinza-900); font-weight: 650; letter-spacing: .02em; }
  input:not([type="range"]) {
    width: 100%;
    min-height: 48px;
    padding: 11px 13px;
    margin: 7px 0 18px;
    border: 1px solid var(--preto);
    border-radius: 2px;
    outline: none;
    background: var(--branco);
    color: var(--cinza-900);
  }
  input:not([type="range"]):focus { box-shadow: 3px 3px 0 var(--preto); }
  button {
    min-height: 42px;
    padding: 9px 15px;
    border: 1px solid var(--preto);
    border-radius: 2px;
    background: var(--preto);
    color: var(--branco);
    font-weight: 650;
    cursor: pointer;
    font-size: 13px;
    transition: transform .14s ease, box-shadow .14s ease, background .14s ease, color .14s ease;
  }
  button:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--preto); }
  button:active:not(:disabled) { transform: translate(0, 0); box-shadow: none; }
  button:focus-visible { outline: 3px solid var(--branco); outline-offset: 2px; box-shadow: 0 0 0 5px var(--preto); }
  button.secundario { background: var(--branco); color: var(--preto); }
  button:disabled { opacity: .36; cursor: default; }
  #btnEntrar { width: 100%; margin-top: 6px; }
  #erro { min-height: 18px; margin: 14px 0 0; color: var(--perigo) !important; line-height: 1.4; }
  #sala { display: none; min-height: 100dvh; padding: 0 18px 88px; }
  .sala-cabecalho {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    min-height: 64px;
    border-bottom: 1px solid var(--cinza-300);
  }
  .marca-sala { display: flex; align-items: center; gap: 9px; font-size: 11px; font-weight: 760; letter-spacing: .14em; text-transform: uppercase; }
  .marca-sala::before { content: ""; width: 9px; height: 9px; background: var(--preto); }
  .destino-sala { display: flex; align-items: center; gap: 10px; color: var(--cinza-600); font-size: 12px; }
  #salaAtual { color: var(--preto); font-weight: 700; }
  .visualizacao {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 280px;
    gap: 16px;
    align-items: start;
    padding: 18px 0;
  }
  #palco {
    position: relative;
    display: grid;
    place-items: center;
    min-width: 0;
    overflow: hidden;
    aspect-ratio: 16/9;
    background: #000;
    border: 1px solid var(--preto);
    border-radius: 2px;
    box-shadow: 4px 4px 0 var(--preto);
  }
  .palco-vazio { width: min(78%, 360px); color: #a1a1a6; text-align: center; }
  .palco-vazio strong { display: block; margin-bottom: 7px; color: var(--branco); font-size: 19px; }
  .palco-vazio span { font-size: 12px; line-height: 1.45; }
  #palco.com-conteudo .palco-vazio { display: none; }
  .seletor-transmissoes {
    min-width: 0;
    padding: 12px;
    background: var(--branco);
    border: 1px solid var(--preto);
    border-radius: 2px;
    box-shadow: 3px 3px 0 var(--preto);
  }
  .seletor-cabecalho { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .seletor-cabecalho strong { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
  #contadorTransmissoes { color: var(--cinza-600); font-size: 10px; }
  #grid { display: flex; flex-direction: column; gap: 10px; max-height: calc(100dvh - 190px); overflow: auto; padding: 1px 4px 5px 1px; }
  .tile {
    position: relative;
    background: #000;
    border: 1px solid var(--preto);
    border-radius: 2px;
    box-shadow: 3px 3px 0 var(--preto);
    overflow: hidden;
    aspect-ratio: 16/9;
  }
  .tile video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .tile.local { order: -1; border-color: var(--sucesso); box-shadow: 3px 3px 0 var(--sucesso); }
  .tile.local[data-transmissao="true"] { order: -2; }
  .tile.qualidade-poor { outline: 3px solid var(--aviso); outline-offset: -4px; }
  .tile.qualidade-lost { outline: 3px solid var(--perigo); outline-offset: -4px; }
  .tile.destaque { outline: 4px solid var(--sucesso); outline-offset: 3px; }
  .tile .badge-local {
    position: absolute;
    z-index: 2;
    top: 10px;
    left: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 9px;
    color: var(--branco);
    background: var(--sucesso);
    border: 1px solid rgba(255,255,255,.55);
    border-radius: 2px;
    font-size: 9px;
    font-weight: 780;
    letter-spacing: .09em;
    text-transform: uppercase;
  }
  .tile .badge-local::before { content: ""; width: 6px; height: 6px; background: var(--branco); border-radius: 50%; }
  #palco > .tile { width: 100%; height: 100%; aspect-ratio: auto; border: 0; border-radius: 0; box-shadow: none; }
  #palco > .tile .acoes { opacity: 1; }
  #grid .tile { flex: 0 0 auto; width: 100%; cursor: pointer; box-shadow: 2px 2px 0 var(--preto); }
  #grid .tile:hover { outline: 2px solid var(--preto); outline-offset: 1px; }
  #grid .tile .acoes { opacity: 1; }
  #grid .tile .acoes button:not(.acao-parar) { display: none; }
  #grid .tile .badge-local { top: 7px; left: 7px; padding: 4px 6px; font-size: 8px; }
  #grid .tile .rotulo { left: 7px; bottom: 7px; max-width: calc(100% - 92px); padding: 4px 6px; font-size: 9px; }
  #grid .tile .volbar { right: 7px; bottom: 7px; min-height: 27px; padding: 3px 4px; }
  #grid .tile .volbar .vol-label { display: none; }
  #grid .tile .volbar input.vol { display: none; }
  .preview-vazio { display: grid; place-items: center; color: var(--branco); }
  .preview-conteudo { width: min(82%, 330px); text-align: center; }
  .preview-conteudo .preview-kicker { display: block; margin-bottom: 9px; color: #a1a1a6; font-size: 9px; font-weight: 780; letter-spacing: .13em; text-transform: uppercase; }
  .preview-conteudo strong { display: block; margin-bottom: 7px; font-size: clamp(20px, 3vw, 30px); letter-spacing: -.035em; }
  .preview-conteudo p { margin: 0 0 17px; color: #a1a1a6; font-size: 12px; line-height: 1.45; }
  .preview-conteudo button { color: var(--preto); background: var(--branco); border-color: var(--branco); }
  .tile .rotulo {
    position: absolute;
    left: 10px;
    bottom: 10px;
    max-width: calc(100% - 236px);
    padding: 6px 9px;
    overflow: hidden;
    color: var(--branco);
    background: rgba(0,0,0,.78);
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 2px;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: .035em;
    text-overflow: ellipsis;
    white-space: nowrap;
    backdrop-filter: blur(14px);
  }
  .tile .volbar {
    position: absolute;
    right: 10px;
    bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 34px;
    padding: 5px 6px 5px 8px;
    color: var(--branco);
    background: rgba(0,0,0,.78);
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 2px;
    backdrop-filter: blur(14px);
  }
  .tile .volbar .vol-label { font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .tile .volbar input.vol { width: clamp(64px, 8vw, 92px); height: 20px; margin: 0; accent-color: var(--branco); cursor: pointer; }
  .tile .volbar button.mudo {
    min-width: 68px;
    min-height: 24px;
    padding: 3px 7px;
    color: var(--branco);
    background: transparent;
    border-color: rgba(255,255,255,.75);
    font-size: 10px;
    letter-spacing: .02em;
  }
  .tile .volbar button.mudo:hover { box-shadow: 2px 2px 0 var(--branco); }
  .tile .volbar button.mudo.ativo { color: var(--preto); background: var(--branco); }
  .tile .acoes { position: absolute; z-index: 3; right: 9px; top: 9px; display: flex; gap: 6px; opacity: 0; transition: opacity .15s; }
  .tile:hover .acoes, .tile:focus-within .acoes { opacity: 1; }
  .tile .acoes button {
    min-height: 30px;
    padding: 5px 9px;
    color: var(--branco);
    background: rgba(0,0,0,.78);
    border-color: rgba(255,255,255,.36);
    font-size: 10px;
    backdrop-filter: blur(14px);
  }
  .tile .acoes button:hover { box-shadow: 2px 2px 0 var(--branco); }
  .tile .acoes button.acao-parar { color: var(--branco); background: rgba(217,45,32,.92); border-color: rgba(255,255,255,.7); }
  .barra {
    position: fixed;
    z-index: 4;
    right: 0;
    bottom: 0;
    left: 0;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 14px max(10px, env(safe-area-inset-bottom));
    background: rgba(255,255,255,.92);
    border-top: 1px solid var(--preto);
    box-shadow: 0 -12px 28px rgba(0,0,0,.06);
    backdrop-filter: blur(18px);
  }
  .barra .espaco { flex: 1; }
  #statusConexao {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 32px;
    padding: 5px 9px;
    color: var(--cinza-600);
    background: var(--cinza-100);
    border: 1px solid var(--cinza-300);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }
  #statusConexao::before { content: ""; width: 7px; height: 7px; background: var(--cinza-600); border-radius: 50%; }
  #statusConexao.conectado { color: var(--sucesso); background: var(--sucesso-bg); border-color: var(--sucesso); }
  #statusConexao.conectado::before { background: var(--sucesso); }
  #statusConexao.reconectando { color: var(--aviso); background: var(--aviso-bg); border-color: var(--aviso); }
  #statusConexao.reconectando::before { background: var(--aviso); }
  #statusConexao.desconectado { color: var(--perigo); background: var(--perigo-bg); border-color: var(--perigo); }
  #statusConexao.desconectado::before { background: var(--perigo); }
  .barra button.ativo { color: var(--branco); background: var(--sucesso); border-color: var(--sucesso); }
  .barra button.acao-perigo:not(:disabled) { color: var(--perigo); background: var(--perigo-bg); border-color: var(--perigo); }
  #painel {
    display: none;
    position: fixed;
    z-index: 5;
    right: 18px;
    bottom: 76px;
    width: 280px;
    padding: 15px;
    background: rgba(255,255,255,.94);
    border: 1px solid var(--preto);
    border-radius: 2px;
    box-shadow: 4px 4px 0 var(--preto);
    font-size: 13px;
    backdrop-filter: blur(18px);
  }
  #painel.aberto { display: block; }
  .painel-cabecalho { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  #painel h2 { margin: 0; color: var(--cinza-600); font-size: 10px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
  #btnFecharPainel { min-height: 28px; padding: 4px 7px; background: var(--branco); color: var(--preto); font-size: 10px; }
  .pessoa { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--cinza-300); }
  .q { padding: 3px 6px; border: 1px solid var(--preto); border-radius: 2px; font-size: 9px; font-weight: 750; letter-spacing: .04em; text-transform: uppercase; }
  .q.excellent { background: var(--sucesso); color: var(--branco); border-color: var(--sucesso); }
  .q.good { background: var(--sucesso-bg); color: var(--sucesso); border-color: var(--sucesso); }
  .q.poor { background: var(--aviso-bg); color: var(--aviso); border-color: var(--aviso); }
  .q.lost { background: var(--perigo-bg); color: var(--perigo); border-color: var(--perigo); }
  .q.unknown { border-color: var(--cinza-300); color: var(--cinza-600); }
  @media (hover: none) {
    .tile .acoes { opacity: 1; }
  }
  @media (max-width: 820px) {
    #sala { padding: 0 12px 136px; }
    .sala-cabecalho { min-height: 56px; }
    #painel { left: 12px; right: 12px; bottom: 130px; width: auto; }
    .visualizacao { grid-template-columns: 1fr; gap: 12px; padding: 12px 0; }
    #grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); max-height: none; }
    .barra { gap: 7px; }
    .barra button { flex: 1 1 auto; }
    .barra .espaco { display: none; }
    #statusConexao { justify-content: center; width: 100%; order: -1; }
    .tile .rotulo { max-width: calc(100% - 220px); }
  }
  @media (max-width: 520px) {
    #entrar { width: min(100% - 28px, 440px); margin-top: 30px; padding: 26px; box-shadow: 6px 6px 0 var(--preto); }
    #entrar .marca { margin-bottom: 34px; }
    .tile .rotulo { top: 9px; bottom: auto; max-width: calc(100% - 170px); }
    .tile .volbar { right: 8px; bottom: 8px; left: 8px; justify-content: space-between; }
    .tile .volbar input.vol { flex: 1; width: auto; }
    .destino-sala { align-items: flex-end; flex-direction: column; gap: 1px; }
    #grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>
<body>

<div id="entrar">
  <div class="marca">LiveKit Screen Share</div>
  <h1>Entre e compartilhe.</h1>
  <p class="sub">Compartilhe tela, câmera e áudio em uma sala.</p>
  <label for="nome">Seu nome</label>
  <input id="nome" placeholder="Seu nome" maxlength="40" autocomplete="name">
  <label for="nomeSala">Nome da sala</label>
  <input id="nomeSala" value="geral" maxlength="40">
  <button id="btnEntrar">Entrar</button>
  <p id="erro" role="alert"></p>
</div>

<div id="sala">
  <div id="painel">
    <div class="painel-cabecalho">
      <h2>Conexao dos participantes</h2>
      <button id="btnFecharPainel" type="button">Fechar</button>
    </div>
    <div id="pessoas"></div>
  </div>
  <header class="sala-cabecalho">
    <div class="marca-sala">LiveKit Screen Share</div>
    <div class="destino-sala">
      <span id="salaAtual">#geral</span>
      <span id="participantesResumo">1 participante</span>
    </div>
  </header>
  <div class="visualizacao">
    <main id="palco" aria-label="Transmissao selecionada">
      <div id="palcoVazio" class="palco-vazio">
        <strong>Escolha uma transmissao</strong>
        <span>Os previews disponiveis aparecem ao lado.</span>
      </div>
    </main>
    <aside class="seletor-transmissoes" aria-label="Transmissoes disponiveis">
      <div class="seletor-cabecalho">
        <strong>Transmissoes</strong>
        <span id="contadorTransmissoes">0 ao vivo</span>
      </div>
      <div id="grid"></div>
    </aside>
  </div>
  <div class="barra">
    <button id="btnTela">Compartilhar tela</button>
    <button id="btnPararTela" class="secundario acao-perigo" disabled>Parar transmissao</button>
    <button id="btnMic" class="secundario" aria-pressed="false">Microfone: desligado</button>
    <button id="btnCam" class="secundario" aria-pressed="false">Camera: desligada</button>
    <span class="espaco"></span>
    <span id="statusConexao" class="reconectando" role="status" aria-live="polite">Conectando</span>
    <button id="btnPainel" class="secundario" aria-expanded="false">Conexoes</button>
    <button id="btnSair" class="secundario">Sair</button>
  </div>
</div>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(function () {});
}
(function () {
  var LK = window.LivekitClient;
  var Room = LK.Room, RoomEvent = LK.RoomEvent, Track = LK.Track;

  var room = null;
  var telas = [];
  var sequenciaTela = 0;
  var parandoTelas = {};
  var nomeSalaAtual = "geral";
  var qualidadePt = { excellent: "Excelente", good: "Boa", poor: "Ruim", lost: "Caiu", unknown: "..." };

  var $ = function (id) { return document.getElementById(id); };
  function tileId(sid, source) { return "t_" + sid + "_" + source; }

  // Cada transmissao guarda seu proprio volume e estado de mudo.
  var audiosPorTransmissao = {};
  var estadoVolume = {};

  function fonteDoAudio(pub) {
    if (pub && pub.source === Track.Source.ScreenShareAudio) {
      return "tela-" + (pub.trackName || pub.trackSid);
    }
    return "audio-" + (pub ? (pub.trackName || pub.trackSid) : "x");
  }

  function chaveVolume(sid, source) { return sid + "::" + source; }

  function estadoDaTransmissao(sid, source) {
    var chave = chaveVolume(sid, source);
    if (!estadoVolume[chave]) estadoVolume[chave] = { valor: 100, mudo: false };
    return estadoVolume[chave];
  }

  function aplicarVolume(sid, source) {
    var chave = chaveVolume(sid, source);
    var estado = estadoDaTransmissao(sid, source);
    var arr = audiosPorTransmissao[chave] || [];
    var volume = estado.mudo ? 0 : estado.valor / 100;
    for (var i = 0; i < arr.length; i++) {
      try { arr[i].setVolume(volume); } catch (e) {}
    }
  }

  function definirVolume(sid, source, pct) {
    estadoDaTransmissao(sid, source).valor = pct;
    aplicarVolume(sid, source);
  }

  function atualizarBotaoMudo(sid, source) {
    var tile = $(tileId(sid, source));
    if (!tile) return;
    var botao = tile.querySelector("button.mudo");
    if (!botao) return;
    var mudo = estadoDaTransmissao(sid, source).mudo;
    botao.textContent = mudo ? "Ativar som" : "Silenciar";
    botao.title = mudo ? "Voltar ao volume anterior" : "Silenciar esta transmissao";
    botao.setAttribute("aria-label", botao.title);
    botao.setAttribute("aria-pressed", mudo ? "true" : "false");
    botao.classList.toggle("ativo", mudo);
  }

  function alternarMudo(sid, source) {
    var estado = estadoDaTransmissao(sid, source);
    estado.mudo = !estado.mudo;
    aplicarVolume(sid, source);
    atualizarBotaoMudo(sid, source);
  }

  function definirStatusConexao(texto, tipo) {
    var status = $("statusConexao");
    status.textContent = texto;
    status.className = tipo || "";
  }

  function definirPainel(aberto) {
    $("painel").classList.toggle("aberto", aberto);
    $("btnPainel").setAttribute("aria-expanded", aberto ? "true" : "false");
  }

  function atualizarBotaoMidia(id, rotulo, ligado) {
    var botao = $(id);
    botao.textContent = rotulo + ": " + (ligado ? (id === "btnCam" ? "ligada" : "ligado") : (id === "btnCam" ? "desligada" : "desligado"));
    botao.classList.toggle("ativo", ligado);
    botao.setAttribute("aria-pressed", ligado ? "true" : "false");
  }

  function atualizarContadorTransmissoes() {
    var quantidade = document.querySelectorAll('.tile:not(#previewVazio)').length;
    $("contadorTransmissoes").textContent = quantidade + " ao vivo";
  }

  function selecionarTile(el) {
    if (!el || !el.isConnected) return;
    var palco = $("palco");
    var atual = palco.querySelector(".tile");
    if (atual === el) return;
    if (atual) {
      atual.classList.remove("selecionado");
      $("grid").prepend(atual);
    }
    el.classList.add("selecionado");
    palco.appendChild(el);
    palco.classList.add("com-conteudo");
  }

  function escolherTileSubstituto() {
    var grid = $("grid");
    var proximo = grid.querySelector('.tile.local[data-transmissao="true"]:not(#previewVazio)') ||
      grid.querySelector('.tile:not(#previewVazio)') ||
      $("previewVazio");
    if (proximo) selecionarTile(proximo);
    else $("palco").classList.remove("com-conteudo");
  }

  function garantirPreviewVazio() {
    if (!room || $("previewVazio") || document.querySelector('.tile.local[data-transmissao="true"]')) return;
    var el = document.createElement("div");
    el.id = "previewVazio";
    el.className = "tile local preview-vazio";
    el.dataset.sid = room.localParticipant.sid;
    el.dataset.transmissao = "true";

    var conteudo = document.createElement("div");
    conteudo.className = "preview-conteudo";
    var kicker = document.createElement("span");
    kicker.className = "preview-kicker";
    kicker.textContent = "Sua transmissao";
    var titulo = document.createElement("strong");
    titulo.textContent = "Nada sendo compartilhado";
    var detalhe = document.createElement("p");
    detalhe.textContent = "Quando voce transmitir, o preview aparece aqui, ao vivo em #" + nomeSalaAtual + ".";
    var botao = document.createElement("button");
    botao.type = "button";
    botao.textContent = "Compartilhar tela";
    botao.onclick = function (evento) { evento.stopPropagation(); compartilharTela(); };

    conteudo.appendChild(kicker);
    conteudo.appendChild(titulo);
    conteudo.appendChild(detalhe);
    conteudo.appendChild(botao);
    el.appendChild(conteudo);
    el.tabIndex = 0;
    el.setAttribute("role", "button");
    el.setAttribute("aria-label", "Sua transmissao. Nada sendo compartilhado.");
    el.onclick = function (evento) {
      if (evento.target.closest("button, input")) return;
      selecionarTile(el);
    };
    el.onkeydown = function (evento) {
      if (evento.key === "Enter" || evento.key === " ") { evento.preventDefault(); selecionarTile(el); }
    };
    $("grid").prepend(el);
    atualizarContadorTransmissoes();
    if (!$("palco").querySelector(".tile")) selecionarTile(el);
  }

  function atualizarEstadoTransmissao() {
    var quantidade = telas.length;
    $("btnPararTela").disabled = quantidade === 0;
    $("btnPararTela").textContent = quantidade > 1 ? "Parar transmissoes" : "Parar transmissao";
    $("btnTela").disabled = quantidade >= 2;
    $("btnTela").textContent = quantidade === 0 ? "Compartilhar tela" : (quantidade === 1 ? "Compartilhar outra tela" : "Limite de telas atingido");
    if (quantidade === 0) garantirPreviewVazio();
  }

  function montarTile(sid, source, rotulo, comVolume) {
    var id = tileId(sid, source);
    var el = $(id);
    var ehLocal = !!(room && room.localParticipant && sid === room.localParticipant.sid);
    var ehTransmissaoLocal = ehLocal && source.indexOf("tela-") === 0;
    if (ehTransmissaoLocal && $("previewVazio")) {
      $("previewVazio").remove();
      if (!$("palco").querySelector(".tile")) $("palco").classList.remove("com-conteudo");
    }
    if (!el) {
      el = document.createElement("div");
      el.className = "tile";
      el.id = id;
      el.dataset.sid = sid;
      el.dataset.source = source;
      el.dataset.transmissao = ehTransmissaoLocal ? "true" : "false";
      if (ehLocal) el.classList.add("local");
      el.tabIndex = 0;
      el.setAttribute("role", "button");
      el.setAttribute("aria-label", "Assistir " + rotulo);
      el.onclick = function (evento) {
        if (evento.target.closest("button, input")) return;
        selecionarTile(el);
      };
      el.onkeydown = function (evento) {
        if (evento.key === "Enter" || evento.key === " ") { evento.preventDefault(); selecionarTile(el); }
      };

      var v = document.createElement("video");
      v.autoplay = true; v.playsInline = true; v.muted = false;
      el.appendChild(v);

      if (ehLocal) {
        var badge = document.createElement("div");
        badge.className = "badge-local";
        badge.textContent = ehTransmissaoLocal ? "Sua transmissao ao vivo" : "Sua camera";
        el.appendChild(badge);
      }

      var acoes = document.createElement("div");
      acoes.className = "acoes";

      if (ehTransmissaoLocal) {
        var nomePublicacao = source.slice("tela-".length);
        var bParar = document.createElement("button");
        bParar.type = "button";
        bParar.className = "acao-parar";
        bParar.textContent = "Parar";
        bParar.title = "Parar esta transmissao";
        bParar.onclick = function (evento) { evento.stopPropagation(); pararTransmissao(nomePublicacao); };
        acoes.appendChild(bParar);
      }

      var bPip = document.createElement("button");
      bPip.type = "button";
      bPip.textContent = "PiP";
      bPip.title = "Abrir ou fechar o picture-in-picture";
      bPip.setAttribute("aria-label", "Picture-in-picture");
      bPip.onclick = function (evento) { evento.stopPropagation(); flutuar(v); };

      var bFull = document.createElement("button");
      bFull.type = "button";
      bFull.className = "acao-fullscreen";
      bFull.textContent = "Tela cheia";
      bFull.onclick = function (evento) { evento.stopPropagation(); telaCheia(el); };

      acoes.appendChild(bPip);
      acoes.appendChild(bFull);
      el.appendChild(acoes);

      var r = document.createElement("div");
      r.className = "rotulo";
      r.textContent = rotulo;
      el.appendChild(r);

      if (comVolume) {
        var vol = document.createElement("div");
        vol.className = "volbar";
        var ico = document.createElement("span");
        ico.className = "vol-label";
        ico.textContent = "Vol";
        var slider = document.createElement("input");
        slider.type = "range"; slider.min = "0"; slider.max = "150";
        slider.value = String(estadoDaTransmissao(sid, source).valor);
        slider.className = "vol";
        slider.title = "Volume desta transmissao (so pra voce)";
        slider.setAttribute("aria-label", "Volume desta transmissao");
        slider.oninput = function () { definirVolume(sid, source, parseInt(slider.value, 10)); };
        var bMudo = document.createElement("button");
        bMudo.type = "button";
        bMudo.className = "mudo";
        bMudo.onclick = function () { alternarMudo(sid, source); };
        vol.appendChild(ico);
        vol.appendChild(slider);
        vol.appendChild(bMudo);
        el.appendChild(vol);
        atualizarBotaoMudo(sid, source);
      }

      $("grid").appendChild(el);
      atualizarContadorTransmissoes();
      if (ehTransmissaoLocal || !$("palco").querySelector(".tile")) selecionarTile(el);
    }
    return el;
  }

  function anexarVideo(track, sid, source, rotulo, comVolume) {
    var el = montarTile(sid, source, rotulo, comVolume);
    track.attach(el.querySelector("video"));
  }
  function removerTile(sid, source) {
    var el = $(tileId(sid, source));
    if (!el) return;
    var estavaSelecionado = el.parentElement === $("palco");
    el.remove();
    atualizarContadorTransmissoes();
    if (estavaSelecionado) escolherTileSubstituto();
  }

  async function flutuar(video) {
    try {
      if (document.pictureInPictureElement === video) { await document.exitPictureInPicture(); }
      else if (document.pictureInPictureEnabled) {
        if (document.pictureInPictureElement) await document.exitPictureInPicture();
        await video.requestPictureInPicture();
      }
      else { alert("Seu navegador nao suporta janela flutuante (PiP)."); }
    } catch (e) { /* usuario cancelou */ }
  }

  async function telaCheia(el) {
    try {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
        if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
        return;
      }
      if (el.requestFullscreen) await el.requestFullscreen();
      // no celular Android tenta deitar; no iPhone isso e ignorado e o video gira sozinho
      if (screen.orientation && screen.orientation.lock) {
        try { await screen.orientation.lock("landscape"); } catch (e) {}
      }
    } catch (e) {}
  }

  function atualizarBotoesTelaCheia() {
    var botoes = document.querySelectorAll("button.acao-fullscreen");
    for (var i = 0; i < botoes.length; i++) {
      var tile = botoes[i].closest(".tile");
      botoes[i].textContent = document.fullscreenElement === tile ? "Sair da tela cheia" : "Tela cheia";
    }
  }

  document.addEventListener("fullscreenchange", atualizarBotoesTelaCheia);

  function fonteDe(pub) {
    if (pub && pub.source === Track.Source.ScreenShare) return "tela-" + (pub.trackName || pub.trackSid);
    if (pub && pub.source === Track.Source.Camera) return "cam";
    return pub ? pub.trackSid : "x";
  }

  function marcarQualidade(sid, quality) {
    var tiles = document.querySelectorAll('.tile[data-sid="' + sid + '"]');
    for (var i = 0; i < tiles.length; i++) {
      tiles[i].classList.toggle("qualidade-poor", quality === "poor");
      tiles[i].classList.toggle("qualidade-lost", quality === "lost");
    }
  }

  function atualizarPainel() {
    var alvo = $("pessoas");
    alvo.innerHTML = "";
    var todos = [room.localParticipant].concat(Array.from(room.remoteParticipants.values()));
    $("participantesResumo").textContent = todos.length + (todos.length === 1 ? " participante" : " participantes");
    todos.forEach(function (p) {
      var quality = p.connectionQuality || "unknown";
      marcarQualidade(p.sid, quality);
      var linha = document.createElement("div");
      linha.className = "pessoa";
      var nome = document.createElement("span");
      nome.textContent = (p === room.localParticipant ? "voce" : (p.name || p.identity));
      var q = document.createElement("span");
      q.className = "q " + quality;
      q.textContent = qualidadePt[quality] || "...";
      linha.appendChild(nome);
      linha.appendChild(q);
      alvo.appendChild(linha);
    });
  }

  function ligarEventos() {
    room
      .on(RoomEvent.TrackSubscribed, function (track, pub, participant) {
        if (track.kind === "video") {
          var ehTela = pub && pub.source === Track.Source.ScreenShare;
          var nomeParticipante = participant.name || participant.identity;
          anexarVideo(track, participant.sid, fonteDe(pub), ehTela ? nomeParticipante + " transmitindo" : nomeParticipante, ehTela);
        } else if (track.kind === "audio") {
          var a = document.createElement("audio");
          a.autoplay = true;
          a.id = "a_" + track.sid;
          track.attach(a);
          document.body.appendChild(a);
          var sourceAudio = fonteDoAudio(pub);
          var chave = chaveVolume(participant.sid, sourceAudio);
          if (!audiosPorTransmissao[chave]) audiosPorTransmissao[chave] = [];
          audiosPorTransmissao[chave].push(track);
          // O audio pode chegar antes ou depois do video.
          aplicarVolume(participant.sid, sourceAudio);
        }
      })
      .on(RoomEvent.TrackUnsubscribed, function (track, pub, participant) {
        if (track.kind === "audio") {
          var sourceAudio = fonteDoAudio(pub);
          var chave = chaveVolume(participant.sid, sourceAudio);
          var arr = audiosPorTransmissao[chave] || [];
          audiosPorTransmissao[chave] = arr.filter(function (t) { return t !== track; });
          var a = $("a_" + track.sid);
          if (a) a.remove();
        } else {
          removerTile(participant.sid, fonteDe(pub));
        }
        track.detach();
      })
      .on(RoomEvent.ConnectionQualityChanged, function () { atualizarPainel(); })
      .on(RoomEvent.ParticipantConnected, function () { atualizarPainel(); })
      .on(RoomEvent.ParticipantDisconnected, function () { atualizarPainel(); })
      .on(RoomEvent.Reconnecting, function () { definirStatusConexao("Reconectando", "reconectando"); })
      .on(RoomEvent.Reconnected, function () { definirStatusConexao("Conectado", "conectado"); })
      .on(RoomEvent.Disconnected, function () { definirStatusConexao("Desconectado", "desconectado"); location.reload(); });
  }

  async function entrar() {
    var nome = $("nome").value.trim() || "convidado";
    var sala = $("nomeSala").value.trim() || "geral";
    nomeSalaAtual = sala;
    localStorage.setItem("meuNome", nome);
    $("btnEntrar").disabled = true;
    $("erro").textContent = "";
    try {
      var resp = await fetch("/token?room=" + encodeURIComponent(sala) + "&name=" + encodeURIComponent(nome));
      var dados = await resp.json();
      var url = dados.url || window.LIVEKIT_URL;
      room = new Room({ adaptiveStream: true, dynacast: true });
      ligarEventos();
      await room.connect(url, dados.token);

      // microfone desligado por padrao
      room.localParticipant.on("localTrackPublished", function (pub) {
        if (pub.track && pub.track.kind === "video" && pub.source === Track.Source.Camera) {
          anexarVideo(pub.track, room.localParticipant.sid, fonteDe(pub), "voce");
        }
      });

      $("entrar").style.display = "none";
      $("sala").style.display = "block";
      document.title = "LiveKit Screen Share · " + sala;
      $("salaAtual").textContent = "#" + sala;
      definirStatusConexao("Conectado", "conectado");
      garantirPreviewVazio();
      atualizarBotaoMidia("btnMic", "Microfone", false);
      atualizarBotaoMidia("btnCam", "Camera", false);
      atualizarPainel();
    } catch (e) {
      $("erro").textContent = "Nao consegui entrar: " + (e && e.message ? e.message : e);
      $("btnEntrar").disabled = false;
    }
  }

  async function compartilharTela() {
    if (telas.length >= 2) { alert("Voce ja esta compartilhando 2 telas (o maximo)."); return; }
    var nomeTela = "";
    try {
      var stream = await navigator.mediaDevices.getDisplayMedia({
        video: {
          frameRate: { ideal: 30, max: 30 },
          width: { ideal: 1920, max: 1920 },
          height: { ideal: 1080, max: 1080 }
        },
        audio: {
          channelCount: { ideal: 2 },
          sampleRate: { ideal: 48000 },
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }
      });
      sequenciaTela += 1;
      nomeTela = "tela-" + sequenciaTela;
      var faixas = stream.getTracks();
      for (var i = 0; i < faixas.length; i++) {
        var track = faixas[i];
        if (track.kind === "video") {
          // prioriza fluidez (bom pra jogo e filme) em vez de nitidez de texto
          try { track.contentHint = "motion"; } catch (e) {}
          var pubV = await room.localParticipant.publishTrack(track, {
            source: Track.Source.ScreenShare,
            name: nomeTela,
            stream: nomeTela,
            // Perfil de alta qualidade para screen share 1080p a 30 fps.
            screenShareEncoding: { maxBitrate: 6000000, maxFramerate: 30 }
          });
          anexarVideo(track, room.localParticipant.sid, "tela-" + nomeTela, "Ao vivo em #" + nomeSalaAtual);
          (function (nome, faixa) {
            faixa.addEventListener("ended", function () { pararTransmissao(nome); }, { once: true });
          })(nomeTela, track);
        } else {
          // Audio de sistema precisa preservar musica, filmes e jogos, nao tratar como voz.
          try { track.contentHint = "music"; } catch (e) {}
          await room.localParticipant.publishTrack(track, {
            source: Track.Source.ScreenShareAudio,
            name: nomeTela,
            stream: nomeTela,
            audioPreset: LK.AudioPresets.musicHighQualityStereo,
            forceStereo: true,
            dtx: false
          });
        }
      }
      telas.push(nomeTela);
      atualizarEstadoTransmissao();
    } catch (e) {
      if (nomeTela) await pararTransmissao(nomeTela);
      /* usuario cancelou o seletor ou a publicacao falhou */
    }
  }

  async function pararTransmissao(nomeTela) {
    if (!room || !nomeTela || parandoTelas[nomeTela]) return;
    parandoTelas[nomeTela] = true;
    try {
      var pubs = Array.from(room.localParticipant.trackPublications.values());
      for (var i = 0; i < pubs.length; i++) {
        var pub = pubs[i];
        var ehTela = pub.source === Track.Source.ScreenShare || pub.source === Track.Source.ScreenShareAudio;
        if (ehTela && pub.trackName === nomeTela && pub.track) {
          try { await room.localParticipant.unpublishTrack(pub.track, true); } catch (e) {}
        }
      }
      removerTile(room.localParticipant.sid, "tela-" + nomeTela);
      telas = telas.filter(function (nome) { return nome !== nomeTela; });
    } finally {
      delete parandoTelas[nomeTela];
      atualizarEstadoTransmissao();
    }
  }

  async function pararTelas() {
    var nomes = telas.slice();
    for (var i = 0; i < nomes.length; i++) {
      await pararTransmissao(nomes[i]);
    }
    // Limpa publicacoes residuais caso uma captura tenha falhado no meio.
    var pubs = Array.from(room.localParticipant.trackPublications.values());
    for (var j = 0; j < pubs.length; j++) {
      var pub = pubs[j];
      if (pub.source === Track.Source.ScreenShare || pub.source === Track.Source.ScreenShareAudio) {
        if (pub.track) {
          try { await room.localParticipant.unpublishTrack(pub.track, true); } catch (e) {}
        }
      }
    }
    telas = [];
    atualizarEstadoTransmissao();
  }

  // preenche o nome salvo
  var salvo = localStorage.getItem("meuNome");
  if (salvo) $("nome").value = salvo;

  $("btnEntrar").onclick = entrar;
  $("btnTela").onclick = compartilharTela;
  $("btnPararTela").onclick = pararTelas;
  $("btnPainel").onclick = function () { definirPainel(!$("painel").classList.contains("aberto")); };
  $("btnFecharPainel").onclick = function () { definirPainel(false); };
  $("btnSair").onclick = function () { if (room) room.disconnect(); };
  $("btnMic").onclick = async function () {
    var on = !room.localParticipant.isMicrophoneEnabled;
    await room.localParticipant.setMicrophoneEnabled(on);
    atualizarBotaoMidia("btnMic", "Microfone", on);
  };
  $("btnCam").onclick = async function () {
    var on = !room.localParticipant.isCameraEnabled;
    await room.localParticipant.setCameraEnabled(on);
    atualizarBotaoMidia("btnCam", "Camera", on);
    if (!on) removerTile(room.localParticipant.sid, "cam");
  };
})();
</script>
</body>
</html>
